<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="sbBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14233c"/>
      <stop offset="50%" stop-color="#0e1828"/>
      <stop offset="100%" stop-color="#060b13"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sbBg)"/>
  <circle cx="480" cy="110" r="180" fill="url(#sunGlow)"/>

  <!-- Pixel Clouds -->
  <g fill="#ffffff" opacity="0.25">
    <rect x="80" y="50" width="100" height="20" rx="3"/>
    <rect x="110" y="35" width="50" height="15" rx="3"/>
    <rect x="380" y="70" width="120" height="24" rx="3"/>
    <rect x="420" y="55" width="60" height="15" rx="3"/>
  </g>

  <!-- Big Isometric Voxel Island (Center) -->
  <g transform="translate(320, 160)">
    <!-- Base Dirt & Stone Layer -->
    <path d="M 0,-50 L 150,25 L 150,115 L 0,190 L -150,115 L -150,25 Z" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <path d="M -150,25 L 0,-50 L 0,190 L -150,115 Z" fill="#92400e"/>
    <path d="M 0,-50 L 150,25 L 150,115 L 0,190 Z" fill="#78350f"/>

    <!-- Lush Grass Top (Voxel Top Face) -->
    <polygon points="0,-50 150,25 0,100 -150,25" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
    <!-- Grass Fringe Hanging Down -->
    <polygon points="-150,25 0,100 0,120 -15,115 -35,123 -60,112 -90,120 -120,110 -150,118" fill="#16a34a"/>
    <polygon points="0,100 150,25 150,45 130,50 100,42 75,52 40,43 15,50 0,120" fill="#15803d"/>

    <!-- Water Stream Block -->
    <polygon points="40,2 100,32 70,47 10,17" fill="#0284c7" opacity="0.9"/>
    <polygon points="70,47 100,32 100,60 70,75" fill="#0369a1"/>

    <!-- Voxel Tree on Island -->
    <g transform="translate(-50, -20)">
      <!-- Wood Trunk -->
      <rect x="-8" y="-35" width="16" height="40" fill="#78350f"/>
      <!-- Block Leaves -->
      <rect x="-35" y="-85" width="54" height="50" rx="4" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
      <rect x="-25" y="-105" width="34" height="25" rx="3" fill="#22c55e"/>
    </g>

    <!-- Pickaxe Icon Planted in Grass -->
    <g transform="translate(60, 40) rotate(-25)">
      <line x1="0" y1="25" x2="0" y2="-25" stroke="#a16207" stroke-width="4" stroke-linecap="round"/>
      <path d="M -18,-20 C -5,-30 5,-30 18,-20 C 12,-24 -12,-24 -18,-20 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(30, 275)">
    <rect width="190" height="55" rx="8" fill="#0b1726" fill-opacity="0.9" stroke="#22c55e" stroke-width="1.5"/>
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="1">SANDBOX WORLD</text>
    <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#86efac" letter-spacing="1.5">BUILD &amp; EXPLORE</text>
  </g>
</svg>