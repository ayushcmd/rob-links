<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="rpgBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1f1a"/>
      <stop offset="60%" stop-color="#091310"/>
      <stop offset="100%" stop-color="#030605"/>
    </linearGradient>
    <radialGradient id="rpgGoldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#047857" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#rpgBg)"/>
  <circle cx="320" cy="150" r="220" fill="url(#rpgGoldGlow)"/>

  <!-- Distant Fantasy Mountain Peaks -->
  <polygon points="60,260 210,120 330,260" fill="#0d241c" opacity="0.6"/>
  <polygon points="260,260 410,90 540,260" fill="#133529" opacity="0.8"/>
  <polygon points="450,260 550,140 650,260" fill="#0d241c" opacity="0.5"/>

  <!-- Floating Sky Islands with Grass & Vines -->
  <g transform="translate(100, 110)">
    <path d="M 0,20 Q 50,-10 100,20 Q 80,60 50,70 Q 20,60 0,20 Z" fill="#1c382b" stroke="#10b981" stroke-width="1.5"/>
    <!-- Floating tiny tree -->
    <rect x="46" y="2" width="8" height="18" fill="#78350f"/>
    <circle cx="50" cy="0" r="16" fill="#10b981"/>
  </g>
  <g transform="translate(460, 140)">
    <path d="M 0,15 Q 40,-8 80,15 Q 60,50 40,60 Q 15,50 0,15 Z" fill="#1c382b" stroke="#10b981" stroke-width="1.5"/>
  </g>

  <!-- Cliff Overlook (Foreground) -->
  <path d="M 0,360 L 0,250 C 120,240 220,250 290,270 C 340,285 450,290 640,270 L 640,360 Z" fill="#08140e"/>

  <!-- Legendary Glowing Sword in Stone -->
  <g transform="translate(320, 200)">
    <!-- Stone Base -->
    <polygon points="-35,60 35,60 25,30 -25,30" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
    <!-- Blade -->
    <polygon points="-5,30 5,30 2,-70 0,-85 -2,-70" fill="#fef08a" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- Sword Crossguard -->
    <rect x="-18" y="28" width="36" height="6" rx="2" fill="#d97706"/>
    <!-- Sword Hilt & Pommel -->
    <rect x="-3" y="34" width="6" height="20" fill="#92400e"/>
    <circle cx="0" cy="56" r="5" fill="#fbbf24"/>
    <!-- Radiant Glow Rays -->
    <line x1="0" y1="-85" x2="0" y2="-120" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="-30" y1="-70" x2="-60" y2="-90" stroke="#fef08a" stroke-width="2" opacity="0.5"/>
    <line x1="30" y1="-70" x2="60" y2="-90" stroke="#fef08a" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Adventurer Silhouette with Cloak (Left) -->
  <g transform="translate(190, 230)">
    <circle cx="0" cy="-18" r="10" fill="#030805"/>
    <path d="M -12,25 C -15,-5 -8,-10 0,-10 C 8,-10 15,-5 12,25 Z" fill="#030805"/>
    <!-- Flowing Cloak -->
    <path d="M -6,-5 C -25,5 -30,25 -26,35 C -20,28 -15,18 -8,10 Z" fill="#047857"/>
  </g>

  <!-- Magic Sparkles / Runes -->
  <g fill="#fde047">
    <circle cx="280" cy="140" r="2.5"/>
    <circle cx="360" cy="120" r="3"/>
    <circle cx="380" cy="170" r="2"/>
    <circle cx="260" cy="180" r="2"/>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(30, 275)">
    <rect width="180" height="55" rx="8" fill="#061711" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="1">UNTITLED RPG</text>
    <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#6ee7b7" letter-spacing="1.5">OPEN WORLD REALM</text>
  </g>
</svg>