<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="doorsBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14100c"/>
      <stop offset="60%" stop-color="#0a0806"/>
      <stop offset="100%" stop-color="#020101"/>
    </linearGradient>
    <radialGradient id="doorLightGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#doorsBg)"/>
  <circle cx="320" cy="165" r="210" fill="url(#doorLightGlow)"/>

  <!-- Wallpaper Pattern on Corridor Walls -->
  <g stroke="#78350f" stroke-width="0.8" opacity="0.25">
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="520" y1="0" x2="520" y2="360"/>
    <line x1="60" y1="0" x2="60" y2="360"/>
    <line x1="580" y1="0" x2="580" y2="360"/>
  </g>

  <!-- Perspective Hallway Angle -->
  <polygon points="0,0 220,70 220,290 0,360" fill="#1b140e" opacity="0.9"/>
  <polygon points="640,0 420,70 420,290 640,360" fill="#1b140e" opacity="0.9"/>
  <polygon points="220,290 420,290 640,360 0,360" fill="#0d0a07"/>
  <polygon points="220,70 420,70 640,0 0,0" fill="#110d09"/>

  <!-- The Mysterious Door Frame -->
  <rect x="255" y="70" width="130" height="220" fill="#29180c" stroke="#d97706" stroke-width="2.5"/>
  <!-- Door Panels -->
  <rect x="268" y="85" width="48" height="85" fill="#1c1109" stroke="#78350f" stroke-width="1.5"/>
  <rect x="324" y="85" width="48" height="85" fill="#1c1109" stroke="#78350f" stroke-width="1.5"/>
  <rect x="268" y="185" width="48" height="90" fill="#1c1109" stroke="#78350f" stroke-width="1.5"/>
  <rect x="324" y="185" width="48" height="90" fill="#1c1109" stroke="#78350f" stroke-width="1.5"/>

  <!-- Door Keyhole and Brass Knob -->
  <circle cx="276" cy="180" r="4" fill="#fbbf24"/>
  
  <!-- Number Plate above Door: 100 -->
  <rect x="295" y="52" width="50" height="15" rx="3" fill="#1e130a" stroke="#d97706" stroke-width="1"/>
  <text x="320" y="64" font-family="monospace" font-weight="900" font-size="11" fill="#fef3c7" text-anchor="middle">#100</text>

  <!-- Glowing Crack under the door -->
  <line x1="260" y1="289" x2="380" y2="289" stroke="#fbbf24" stroke-width="3" opacity="0.9"/>
  
  <!-- Shadow entity creeping from side -->
  <path d="M 460,280 C 440,240 430,220 445,190 C 455,170 430,160 415,195 C 405,220 420,260 440,290 Z" fill="#000000" opacity="0.85"/>
  <!-- Eye in shadow -->
  <circle cx="430" cy="180" r="3" fill="#ef4444"/>

  <!-- Wall Sconce / Lantern on Left Wall -->
  <rect x="180" y="145" width="8" height="24" fill="#78350f"/>
  <circle cx="184" cy="140" r="10" fill="#f59e0b" opacity="0.8"/>

  <!-- Title Badge Overlay -->
  <g transform="translate(30, 275)">
    <rect width="160" height="55" rx="8" fill="#160e07" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="1">DOORS</text>
    <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#fbbf24" letter-spacing="1.5">ESCAPE HOTEL</text>
  </g>
</svg>