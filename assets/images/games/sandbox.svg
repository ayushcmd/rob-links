<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="sbxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142618"/>
      <stop offset="100%" stop-color="#050d07"/>
    </linearGradient>
    <radialGradient id="sbxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sbxBg)"/>
  <circle cx="320" cy="180" r="200" fill="url(#sbxGlow)"/>
  <!-- Isometric Grass Cube -->
  <g transform="translate(320, 190)">
    <polygon points="0,-60 65,-25 0,10 -65,-25" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
    <polygon points="-65,-25 0,10 0,75 -65,40" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <polygon points="0,10 65,-25 65,40 0,75" fill="#92400e" stroke="#451a03" stroke-width="2"/>
  </g>
  <text x="320" y="70" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="2">SANDBOX</text>
</svg>