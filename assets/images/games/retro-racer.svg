<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="rrBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180b26"/>
      <stop offset="50%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#090114"/>
    </linearGradient>
    <linearGradient id="rrSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="rrGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#rrBg)"/>
  <circle cx="320" cy="180" r="220" fill="url(#rrGlow)"/>

  <!-- Synthwave Sun (Segmented) -->
  <g transform="translate(320, 150)">
    <circle cx="0" cy="0" r="60" fill="url(#rrSun)"/>
    <!-- Horizon cutouts in sun -->
    <rect x="-65" y="10" width="130" height="4" fill="#180b26"/>
    <rect x="-65" y="20" width="130" height="6" fill="#180b26"/>
    <rect x="-65" y="32" width="130" height="8" fill="#180b26"/>
    <rect x="-65" y="46" width="130" height="10" fill="#180b26"/>
  </g>

  <!-- Horizon Line -->
  <line x1="0" y1="180" x2="640" y2="180" stroke="#06b6d4" stroke-width="2"/>

  <!-- Synthwave Neon Floor Grid (Perspective) -->
  <g stroke="#d946ef" stroke-width="1.5" opacity="0.65">
    <line x1="320" y1="180" x2="-100" y2="360"/>
    <line x1="320" y1="180" x2="30" y2="360"/>
    <line x1="320" y1="180" x2="160" y2="360"/>
    <line x1="320" y1="180" x2="270" y2="360"/>
    <line x1="320" y1="180" x2="370" y2="360"/>
    <line x1="320" y1="180" x2="480" y2="360"/>
    <line x1="320" y1="180" x2="610" y2="360"/>
    <line x1="320" y1="180" x2="740" y2="360"/>
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="195" x2="640" y2="195" stroke="#06b6d4" stroke-width="1"/>
    <line x1="0" y1="215" x2="640" y2="215" stroke="#06b6d4" stroke-width="1.2"/>
    <line x1="0" y1="245" x2="640" y2="245" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="0" y1="290" x2="640" y2="290" stroke="#06b6d4" stroke-width="2"/>
    <line x1="0" y1="345" x2="640" y2="345" stroke="#06b6d4" stroke-width="2.5"/>
  </g>

  <!-- Supercar Rear Silhouette (Speeding towards Sun) -->
  <g transform="translate(320, 240)">
    <!-- Car Body -->
    <polygon points="-70,50 -55,10 -35,-8 35,-8 55,10 70,50 60,60 -60,60" fill="#150524" stroke="#06b6d4" stroke-width="2"/>
    <!-- Cabin Roof -->
    <polygon points="-30,-8 -18,-30 18,-30 30,-8" fill="#08020e" stroke="#06b6d4" stroke-width="1.5"/>
    <!-- Rear Window -->
    <polygon points="-24,-10 -14,-26 14,-26 24,-10" fill="#38bdf8" opacity="0.4"/>
    <!-- Rear Spoiler Wing -->
    <rect x="-65" y="-5" width="130" height="7" rx="3" fill="#d946ef"/>
    <!-- Glowing Neon Taillights -->
    <rect x="-60" y="22" width="45" height="8" rx="3" fill="#f43f5e"/>
    <rect x="15" y="22" width="45" height="8" rx="3" fill="#f43f5e"/>
    <!-- Dual Exhaust Glow -->
    <circle cx="-25" cy="52" r="5" fill="#06b6d4"/>
    <circle cx="25" cy="52" r="5" fill="#06b6d4"/>
    <!-- Motion / Speed Streaks -->
    <line x1="-80" y1="35" x2="-140" y2="35" stroke="#06b6d4" stroke-width="2"/>
    <line x1="80" y1="35" x2="140" y2="35" stroke="#06b6d4" stroke-width="2"/>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(30, 275)">
    <rect width="180" height="55" rx="8" fill="#1b082e" fill-opacity="0.9" stroke="#d946ef" stroke-width="1.5"/>
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="1">RETRO RACER</text>
    <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#f472b6" letter-spacing="1.5">SYNTHWAVE VELOCITY</text>
  </g>
</svg>