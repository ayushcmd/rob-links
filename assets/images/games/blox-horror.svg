<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="bhBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08100d"/>
      <stop offset="60%" stop-color="#040706"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="bhGreenGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#064e3b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doorLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bhBg)"/>
  <circle cx="320" cy="160" r="240" fill="url(#bhGreenGlow)"/>

  <!-- Spooky Corridor Walls -->
  <polygon points="0,0 200,80 200,280 0,360" fill="#0d1f18" opacity="0.8"/>
  <polygon points="640,0 440,80 440,280 640,360" fill="#0d1f18" opacity="0.8"/>
  <line x1="200" y1="80" x2="0" y2="0" stroke="#059669" stroke-width="1.5" opacity="0.3"/>
  <line x1="200" y1="280" x2="0" y2="360" stroke="#059669" stroke-width="1.5" opacity="0.3"/>
  <line x1="440" y1="80" x2="640" y2="0" stroke="#059669" stroke-width="1.5" opacity="0.3"/>
  <line x1="440" y1="280" x2="640" y2="360" stroke="#059669" stroke-width="1.5" opacity="0.3"/>

  <!-- Creepy End Doorway -->
  <rect x="270" y="80" width="100" height="190" fill="#030805" stroke="#10b981" stroke-width="2"/>
  <rect x="280" y="90" width="80" height="175" fill="url(#doorLight)" opacity="0.65"/>
  <!-- Dark Shadowy Figure in Doorway -->
  <circle cx="320" cy="140" r="14" fill="#020403"/>
  <path d="M 302,230 L 308,160 C 310,154 330,154 332,160 L 338,230 Z" fill="#020403"/>
  <!-- Glowing Red Eyes -->
  <circle cx="316" cy="139" r="2" fill="#ef4444"/>
  <circle cx="324" cy="139" r="2" fill="#ef4444"/>

  <!-- Floating Floor Mist / Fog -->
  <ellipse cx="320" cy="300" rx="260" ry="40" fill="#10b981" opacity="0.15"/>
  <ellipse cx="250" cy="320" rx="180" ry="25" fill="#34d399" opacity="0.1"/>

  <!-- Scratch Marks / Spooky Vines -->
  <path d="M 120,60 L 135,110 M 130,55 L 145,105 M 140,65 L 150,115" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>

  <!-- Title Badge Overlay -->
  <g transform="translate(30, 275)">
    <rect width="180" height="55" rx="8" fill="#05100b" fill-opacity="0.85" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="1">BLOX HORROR</text>
    <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#34d399" letter-spacing="1.5">PSYCHOLOGICAL THRILLER</text>
  </g>
</svg>