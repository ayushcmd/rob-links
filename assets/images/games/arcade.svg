<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="arcBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241032"/>
      <stop offset="100%" stop-color="#08020d"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#arcBg)"/>
  <!-- Joystick and buttons -->
  <g transform="translate(320, 190) scale(1.3)">
    <!-- Base plate -->
    <rect x="-60" y="0" width="120" height="40" rx="8" fill="#1f142b" stroke="#ec4899" stroke-width="2"/>
    <!-- Stick -->
    <line x1="-30" y1="10" x2="-35" y2="-30" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-35" cy="-35" r="14" fill="#ef4444"/>
    <!-- Buttons -->
    <circle cx="10" cy="20" r="8" fill="#38bdf8"/>
    <circle cx="35" cy="15" r="8" fill="#facc15"/>
  </g>
  <text x="320" y="70" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="2">ARCADE</text>
</svg>