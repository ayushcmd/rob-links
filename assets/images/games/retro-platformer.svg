<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="rpBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1636"/>
      <stop offset="100%" stop-color="#0b0410"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#rpBg)"/>
  <!-- Floating platforms -->
  <rect x="80" y="240" width="140" height="24" rx="4" fill="#a855f7" stroke="#c084fc" stroke-width="2"/>
  <rect x="250" y="170" width="140" height="24" rx="4" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  <rect x="420" y="110" width="140" height="24" rx="4" fill="#ec4899" stroke="#f472b6" stroke-width="2"/>
  <!-- Gold Coins -->
  <circle cx="320" cy="130" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <circle cx="490" cy="70" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <!-- Pixel Hero jumping -->
  <g transform="translate(150, 195)">
    <rect x="-12" y="-24" width="24" height="24" rx="4" fill="#f43f5e"/>
    <rect x="-6" y="-18" width="8" height="6" fill="#ffffff"/>
    <rect x="-10" y="0" width="8" height="15" fill="#38bdf8"/>
    <rect x="2" y="0" width="8" height="15" fill="#38bdf8"/>
  </g>
  <text x="320" y="55" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="2">PLATFORMER</text>
</svg>