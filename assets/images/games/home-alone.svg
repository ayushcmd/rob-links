<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="haBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111222"/>
      <stop offset="60%" stop-color="#0a0b14"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <radialGradient id="anomalyRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#4c0519" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#haBg)"/>
  <circle cx="320" cy="170" r="190" fill="url(#anomalyRed)"/>

  <!-- Suburban House Silhouette -->
  <g fill="#07080e">
    <!-- Main roof and body -->
    <polygon points="180,180 320,80 460,180"/>
    <rect x="200" y="180" width="240" height="130"/>
    <!-- Chimney -->
    <rect x="380" y="90" width="30" height="60"/>
    <!-- Garage wing -->
    <polygon points="440,210 500,170 560,210"/>
    <rect x="450" y="210" width="100" height="100"/>
  </g>

  <!-- Distorted Anomaly Windows -->
  <rect x="230" y="195" width="40" height="40" fill="#f43f5e" opacity="0.85"/>
  <!-- Window Cross -->
  <line x1="250" y1="195" x2="250" y2="235" stroke="#07080e" stroke-width="3"/>
  <line x1="230" y1="215" x2="270" y2="215" stroke="#07080e" stroke-width="3"/>

  <!-- Upstairs Attic Window (Red Glitch) -->
  <polygon points="320,110 300,140 340,140" fill="#fb7185"/>

  <!-- Creepy Front Doorway -->
  <rect x="300" y="230" width="40" height="80" fill="#ffe4e6" opacity="0.9"/>
  <!-- Silhouette in doorway -->
  <path d="M 314,260 C 314,250 326,250 326,260 L 328,310 L 312,310 Z" fill="#07080e"/>

  <!-- Glitch Artifacts / Scan Lines -->
  <g stroke="#f43f5e" opacity="0.4" stroke-width="1.5">
    <line x1="120" y1="95" x2="240" y2="95"/>
    <line x1="380" y1="125" x2="520" y2="125"/>
    <line x1="150" y1="240" x2="190" y2="240"/>
    <line x1="450" y1="260" x2="560" y2="260"/>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(30, 275)">
    <rect width="210" height="55" rx="8" fill="#130810" fill-opacity="0.9" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#ffffff" letter-spacing="0.5">HOME ALONE</text>
    <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#fda4af" letter-spacing="1.5">ANOMALIES SURVEILLANCE</text>
  </g>
</svg>