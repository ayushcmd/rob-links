<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <defs>
    <linearGradient id="logoCubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="50%" stop-color="#335fff"/>
      <stop offset="100%" stop-color="#1e3fb8"/>
    </linearGradient>
    <linearGradient id="logoInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#335fff" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(28, 28) rotate(-14)" filter="url(#logoGlow)">
    <rect x="-18" y="-18" width="36" height="36" rx="7" fill="url(#logoCubeGrad)" stroke="#688eff" stroke-width="1.5"/>
    <!-- Hollow Portal -->
    <rect x="-7.5" y="-7.5" width="15" height="15" rx="3.5" fill="url(#logoInnerGrad)" stroke="#1e3fb8" stroke-width="1"/>
    <!-- Center Green Indicator (Live/Ready) -->
    <circle cx="0" cy="0" r="2.5" fill="#45d483"/>
  </g>

  <!-- Text: ROB-LINKS -->
  <text x="62" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-size="24" letter-spacing="1.5" fill="url(#textGrad)">
    ROB<tspan fill="#335fff">-</tspan>LINKS
  </text>
  
  <!-- Subtle sub-badge "GAMES" -->
  <rect x="186" y="21" width="46" height="16" rx="4" fill="#1e2433" stroke="rgba(51,95,255,0.4)" stroke-width="1"/>
  <text x="209" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#335fff" text-anchor="middle" letter-spacing="1">HUB</text>
</svg>