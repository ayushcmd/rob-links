<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080c14">
<meta name="description" content="Discover browser games, WebAssembly ports, and creative gaming projects with clear launch options.">
<title>ROB-LINK HUB · Games without friction</title>
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/games-data.js" defer></script>
<script src="assets/js/catalog.js" defer></script>
<script src="assets/js/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#home" aria-label="ROB-LINK Home">
      <span class="brand-icon-wrap">
        <img src="assets/images/origami-controller.png" class="brand-logo-img" width="52" height="30" alt="">
      </span>
      <span class="brand-text">ROB<span class="brand-dash">-</span>LINK</span>
      <span class="brand-badge">HUB</span>
    </a>
    <nav id="navigation" aria-label="Main navigation">
      <a href="#home" id="nav-home">Home</a>
      <a href="#discover" id="nav-discover">Discover</a>
      <a href="#trending" id="nav-trending">Trending</a>
      <a href="#genres" id="nav-genres">Genres <span class="nav-chevron" aria-hidden="true">▾</span></a>
      <a href="#about" id="nav-about">About</a>
    </nav>
    <div class="header-actions">
      <button class="search-trigger" id="search-open" aria-label="Search games">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="7"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
        </span>
        <span class="search-label">Search games…</span>
        <kbd aria-hidden="true">/</kbd>
      </button>
      <div class="user-avatar" title="Online" aria-label="User status: Online">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        <span class="status-pip" aria-hidden="true"></span>
      </div>
      <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="navigation">☰</button>
    </div>
  </div>
</header>

<main id="main" class="container" tabindex="-1"></main>
<noscript><p class="container notice">Enable JavaScript to browse the game catalog and use the player.</p></noscript>

<footer class="container site-footer">
  <div class="footer-brand">
    <div class="footer-brand-header">
      <img src="assets/images/origami-controller.png" class="footer-logo-img" width="36" height="21" alt="" aria-hidden="true">
      <strong>ROB-LINK <span class="lime">HUB</span></strong>
    </div>
    <p>Less searching. More playing.</p>
  </div>
  <p class="footer-credits">An independent discovery hub.<br>Games and artwork belong to their respective creators.</p>
  <a class="footer-link" href="#about">About &amp; credits ↗</a>
</footer>

<dialog id="search-dialog" aria-labelledby="search-heading">
  <div class="dialog-heading">
    <h2 id="search-heading">Find your next game</h2>
    <button class="icon-button" id="search-close" aria-label="Close search">×</button>
  </div>
  <label for="global-search">Search titles, genres, platforms, and keywords</label>
  <div class="search-field">
    <input id="global-search" type="search" placeholder="Try Quake, racing, WebGL…" autocomplete="off">
    <button id="search-clear" class="text-button">Clear</button>
  </div>
  <p id="search-count" role="status"></p>
  <div id="search-results"></div>
</dialog>
</body>
</html>
